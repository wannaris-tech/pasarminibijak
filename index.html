<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pasar Mini Bijak</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Animations and CSS -->
  <style>
    .bg-mint-50 { background-color: #f0fdfa; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .animate-bounce-slight { animation: bounceSlight 3s ease-in-out infinite; }
    .animate-premium-float { animation: premiumFloat 3.5s ease-in-out infinite; }
    .animate-wobble { animation: wobble 0.5s ease-in-out; }
    .animate-invite { animation: invite 2.5s ease-in-out infinite; }
    
    .animate-conveyor { width: max-content; animation: slideLeft 25s linear infinite; }
    @keyframes slideLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-25%); } }
    
    .shelf-3d {
      background: linear-gradient(180deg, #fed7aa 0%, #fdba74 30%, #ea580c 95%, #9a3412 100%);
      border-bottom: 4px solid #9a3412;
      border-radius: 6px;
    }
    
    @keyframes premiumFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes bounceSlight { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    
    @keyframes wobble { 
      0%, 100% { transform: translateX(0); } 
      25% { transform: translateX(-5px) rotate(-1deg); } 
      75% { transform: translateX(5px) rotate(1deg); } 
    }

    @keyframes invite {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.01); }
    }

    @keyframes burst {
      0% { transform: scale(0); opacity: 1; }
      60% { opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(-5deg) scale(0.8); opacity: 0; }
      10% { opacity: 1; transform: translateY(-10vh) rotate(5deg) scale(1); }
      90% { opacity: 1; transform: translateY(-90vh) rotate(-5deg) scale(1); }
      100% { transform: translateY(-120vh) rotate(5deg) scale(0.8); opacity: 0; }
    }
    
    @keyframes bubblePop {
      0% { transform: scale(1); opacity: 1; }
      40% { transform: scale(1.4); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .animate-float-up { animation: floatUp 8s ease-in-out infinite; }
    .animate-bubble-pop { animation: bubblePop 0.3s ease-out forwards; }
    .animate-firework {
      animation: burst 2s ease-out infinite;
      transform-origin: center;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    /* Hide number input spinners */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; margin: 0; 
    }
  </style>
</head>
<body class="bg-slate-200 font-sans overflow-hidden flex justify-center items-center min-h-screen">
  
  <!-- Audio Toggle Button -->
  <button 
    onclick="toggleAudio()"
    id="audio-btn"
    class="absolute top-4 right-4 z-50 bg-white/90 backdrop-blur px-4 py-2 rounded-full shadow-lg border-2 border-slate-300 font-bold text-slate-700 hover:bg-slate-50 active:scale-95 transition-all flex items-center justify-center text-sm"
  >
    🔇 Muzik: OFF
  </button>

  <!-- Main Application Container -->
  <div id="app" class="relative w-full h-[100dvh] max-w-md mx-auto shadow-2xl overflow-hidden bg-white sm:h-[90vh] sm:rounded-[40px] sm:border-[8px] border-slate-800 ring-4 ring-slate-300">
    <!-- UI will be rendered here by JS -->
  </div>

  <script>
    // ==========================================
    // 1. AUDIO ENGINE (Web Audio API)
    // ==========================================
    let audioCtx = null;
    let globalAudioEnabled = false;

    const initAudio = () => {
      try {
        if (!window.AudioContext && !window.webkitAudioContext) return false;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return true;
      } catch (e) { return false; }
    };

    const playTone = (freq, type, duration, vol = 0.1) => {
      if (!globalAudioEnabled || !initAudio()) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    };

    const playMusic = () => {
      if (!globalAudioEnabled || !initAudio()) return;
      const notes = [392.00, 523.25, 659.25, 783.99]; 
      notes.forEach((freq, i) => {
        setTimeout(() => playTone(freq, 'sine', 0.4, 0.15), i * 150);
      });
    };

    const playCorrect = () => {
      if (!globalAudioEnabled || !initAudio()) return;
      playTone(600, 'sine', 0.1, 0.1);
      setTimeout(() => playTone(800, 'sine', 0.2, 0.15), 100);
    };

    const playWrong = () => {
      if (!globalAudioEnabled || !initAudio()) return;
      playTone(150, 'sawtooth', 0.4, 0.1); 
    };

    const playTing = () => {
      if (!globalAudioEnabled || !initAudio()) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 2.0);
    };

    window.toggleAudio = () => {
      globalAudioEnabled = !globalAudioEnabled;
      state.audioOn = globalAudioEnabled;
      document.getElementById('audio-btn').innerText = globalAudioEnabled ? '🎵 Muzik: ON' : '🔇 Muzik: OFF';
      if (globalAudioEnabled) initAudio();
      manageAudioLoops();
    };

    const enableAudio = () => {
      if (!globalAudioEnabled) {
        globalAudioEnabled = true;
        state.audioOn = true;
        document.getElementById('audio-btn').innerText = '🎵 Muzik: ON';
        initAudio();
        manageAudioLoops();
      }
    };

    let bgInterval = null;
    let shopOsc = null;
    let shopGain = null;

    const manageAudioLoops = () => {
      // Clear existing
      if (bgInterval) clearInterval(bgInterval);
      if (shopOsc) { try { shopOsc.stop(); } catch(e){} shopOsc = null; }

      if (state.audioOn) {
        if (state.gameState !== 'shop' && state.gameState !== 'checkout' && state.gameState !== 'bubbleGame') {
          const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
          let i = 0;
          bgInterval = setInterval(() => {
            if (audioCtx && audioCtx.state === 'running' && globalAudioEnabled) {
               playTone(melody[i % melody.length], 'sine', 0.15, 0.03);
               i++;
            }
          }, 450);
        } else if ((state.gameState === 'shop' || state.gameState === 'checkout') && initAudio()) {
          const cheerfulMelody = [523.25, 659.25, 783.99, 659.25, 523.25, 783.99, 1046.50, 783.99];
          let j = 0;
          bgInterval = setInterval(() => {
            if (audioCtx && audioCtx.state === 'running' && globalAudioEnabled) {
               playTone(cheerfulMelody[j % cheerfulMelody.length], 'triangle', 0.12, 0.04);
               j++;
            }
          }, 220); 
        }
      }
    };

    // ==========================================
    // 2. DATA & CONSTANTS
    // ==========================================
    const formatMoney = (amount) => `RM ${amount.toFixed(2)}`;
    const getRandomItems = (arr, n) => [...arr].sort(() => 0.5 - Math.random()).slice(0, n);

    const CATALOG = [
      { id: 'Epal', name: 'Epal', price: 2.00 }, { id: 'Pisang', name: 'Pisang', price: 2.00 },
      { id: 'Oren', name: 'Oren', price: 2.00 }, { id: 'Roti', name: 'Roti', price: 3.00 },
      { id: 'Telur', name: 'Telur', price: 4.00 }, { id: 'Beras', name: 'Beras', price: 10.00 },
      { id: 'Biskut', name: 'Biskut', price: 3.00 }, { id: 'Keju', name: 'Keju', price: 5.00 },
      { id: 'Susu', name: 'Susu', price: 5.00 }, { id: 'Air Mineral', name: 'Air Mineral', price: 1.00 },
      { id: 'Keropok', name: 'Keropok', price: 1.00 }, { id: 'Lobak Merah', name: 'Lobak Merah', price: 2.00 },
      { id: 'Gula-gula', name: 'Gula-gula', price: 0.50 }, { id: 'Beg Plastik', name: 'Beg Plastik', price: 0.20 },
      { id: 'Coklat', name: 'Coklat', price: 3.00 }, { id: 'Air Kotak', name: 'Air Kotak', price: 2.00 },
      { id: 'Ais Krim', name: 'Ais Krim', price: 2.00 }, { id: 'Jam', name: 'Jam', price: 4.00 },
      { id: 'Mentega', name: 'Mentega', price: 4.00 },
      { id: 'Lollipop', name: 'Lollipop', price: 0.30 }, { id: 'Coklat Kecil', name: 'Coklat Kecil', price: 0.20 },
    ];
    const ALL_MONEY_VALUES = [10, 5, 1, 0.50, 0.20, 0.10, 0.05];
    const PRESCHOOL_MONEY_VALUES = [10, 5, 1, 0.50, 0.20, 0.10];

    const STICKERS = [
      { id: 's1', icon: 'Epal', name: 'Epal Comel', hint: "Selesaikan Tahap 1A (Kenal Wang) untuk dapatkan saya!" },
      { id: 's2', icon: 'Susu', name: 'Susu Segar', hint: "Dapatkan 3 Bintang ⭐⭐⭐ di Tahap 1A untuk bawa saya pulang!" },
      { id: 's3', icon: 'Troli Sakti', name: 'Troli Sakti', hint: "Jom penuhkan troli! Selesaikan permainan di Tahap 1B (Padan Nilai)." },
      { id: 's4', icon: 'Roti', name: 'Roti Gembira', hint: "Misi mengira! Bantu roti ini dengan menyelesaikan Tahap 1B." },
      { id: 's5', icon: 'Mahkota Juruwang', name: 'Mahkota Juruwang - Epik', hint: "Stiker Hebat! Dapatkan 3 Bintang ⭐⭐⭐ di Tahap 1A atau 1B!" },
      { id: 's6', icon: 'Kon Pelangi', name: 'Kon Pelangi', hint: "Selesaikan Tahap 2A (Beli 2 Barang) untuk makan aiskrim ini!" },
      { id: 's7', icon: 'Cawan Coklat', name: 'Cawan Coklat', hint: "Mari mengira! Selesaikan misi di Tahap 2A." },
      { id: 's8', icon: 'Trak Aiskrim Comel', name: 'Trak Aiskrim Comel', hint: "Buka kunci trak ini dengan menyelesaikan Tahap 2B (Kira Baki)!" },
      { id: 's9', icon: 'Sirap Strawberi Gembira', name: 'Sirap Strawberi', hint: "Dapatkan 3 Bintang ⭐⭐⭐ di Tahap 2A untuk tuang sirap strawberi!" },
      { id: 's10', icon: 'Gergasi Sang Suria', name: 'Sang Suria - Epik', hint: "Cabaran Terhebat! Dapatkan 3 Bintang ⭐⭐⭐ di Tahap 2B!" },
      { id: 's11', icon: 'Tabung Duit', name: 'Tabung Duit', hint: "Hebat! Selesaikan Tahap 3A untuk isi tabung bank kamu." },
      { id: 's12', icon: 'Bangunan Bank Mini', name: 'Bank Mini', hint: "Misi menyimpan! Selesaikan Tahap 3B untuk simpan wang di sini." },
      { id: 's13', icon: 'Beg Duit Comel', name: 'Beg Duit Comel', hint: "Buka kunci bank ini dengan menyelesaikan cabaran di Tahap 3A!" },
      { id: 's14', icon: 'Kad Matrik Pintar', name: 'Kad Matrik - Epik', hint: "Maju ke depan! Dapatkan 3 Bintang ⭐⭐⭐ di Tahap 3B!" },
      { id: 's15', icon: 'Piala Juara', name: 'Piala Juara', hint: "Raih 3 bintang pada semua peringkat!" },
      { id: 's16', icon: 'Pingat Emas', name: 'Pingat Emas', hint: "Raih 3 bintang pada semua peringkat!" },
    ];

    const ALBUMS = [
      { id: 'a1', title: 'Pasar Raya Cilik', theme: 'bg-pink-100', stickerIds: ['s1', 's2', 's3', 's4', 's5'] },
      { id: 'a2', title: 'Kedai Aiskrim', theme: 'bg-sky-100', stickerIds: ['s6', 's7', 's8', 's9', 's10'] },
      { id: 'a3', title: 'Bank Mainan', theme: 'bg-orange-100', stickerIds: ['s11', 's12', 's13', 's14'] },
      { id: 'a4', title: 'Pentas Juara', theme: 'bg-yellow-100', stickerIds: ['s15', 's16'] },
    ];

    // ==========================================
    // 3. UI COMPONENTS (HTML Template Strings)
    // ==========================================
    const Button3D = (text, onClickStr, color = 'blue', className = '', style = '') => {
      const colorMap = {
        blue: 'bg-sky-400 border-sky-600 shadow-[0_6px_0_theme(colors.sky.300)]',
        green: 'bg-teal-400 border-teal-600 shadow-[0_6px_0_theme(colors.teal.300)]',
        pink: 'bg-pink-400 border-pink-600 shadow-[0_6px_0_theme(colors.pink.300)]',
        orange: 'bg-orange-400 border-orange-600 shadow-[0_6px_0_theme(colors.orange.300)]',
        red: 'bg-red-400 border-red-600 shadow-[0_6px_0_theme(colors.red.300)]',
      };
      const activeShadow = 'active:shadow-none active:translate-y-1.5';
      return `
        <button onclick="${onClickStr}" style="${style}" class="relative inline-flex items-center justify-center px-6 py-3 font-bold text-white rounded-full border-2 transition-all duration-75 select-none ${colorMap[color] || colorMap.blue} ${activeShadow} ${className}">
          <span class="absolute top-0 left-0 w-full h-1/3 bg-white opacity-25 rounded-t-full pointer-events-none"></span>
          <span class="relative z-10 w-full text-center flex flex-col justify-center items-center gap-2">${text}</span>
        </button>`;
    };

    const Shopkeeper = (size = null, className = "") => {
      const inlineStyle = size ? `width: ${size}px; height: ${size}px;` : '';
      return `<img src="https://i.ibb.co/k6Mh7Gnk/Whats-App-Image-2026-11-02-at-5-36-08-PM-removebg-preview.png" alt="Pekedai" style="${inlineStyle}" class="object-contain animate-invite ${className}" />`;
    };

    const SpeechBubble = (text, className = "", tailPos = "bottom") => `
      <div class="relative bg-gradient-to-br from-amber-100 to-yellow-300 rounded-3xl p-3 shadow-[0_4px_0_#d97706] border-2 border-amber-400 min-w-[160px] text-center animate-bounce-slight ${className}">
        <p class="text-slate-900 font-extrabold text-sm leading-snug drop-shadow-[0_1px_1px_rgba(255,255,255,0.7)] whitespace-pre-line">${text}</p>
        ${tailPos === 'bottom' 
          ? `<div class="absolute -bottom-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[12px] border-l-transparent border-t-[16px] border-t-amber-400 border-r-[12px] border-r-transparent filter drop-shadow-sm"></div>`
          : `<div class="absolute -left-3 bottom-4 w-0 h-0 border-t-[8px] border-t-transparent border-r-[14px] border-r-amber-400 border-b-[8px] border-b-transparent filter drop-shadow-sm"></div>`
        }
      </div>`;

    const Firework = (delay = 0, left, top, scale = 1) => {
      const colors = ['#ef4444', '#3b82f6', '#10b981', '#facc15', '#a855f7', '#ec4899'];
      let html = `<div class="absolute pointer-events-none z-10" style="left: ${left}; top: ${top}; transform: translate(-50%, -50%) scale(${scale})">
        <svg class="w-32 h-32 animate-firework" style="animation-delay: ${delay}s" viewBox="0 0 100 100">`;
      for(let i=0; i<12; i++) {
        html += `<g transform="rotate(${i * 30} 50 50)">
            <circle cx="50" cy="10" r="4" fill="${colors[i % colors.length]}" />
            <line x1="50" y1="50" x2="50" y2="25" stroke="${colors[(i + 1) % colors.length]}" stroke-width="3" stroke-linecap="round" opacity="0.8" />
          </g>`;
      }
      html += `</svg></div>`;
      return html;
    };

    // ==========================================
    // 4. SVG BUILDERS
    // ==========================================
    const HibiscusSVG = `<g transform="translate(35, 45) scale(0.45)" opacity="0.9"><path d="M 0 0 C -20 -30, -40 -10, 0 10 C 40 -10, 20 -30, 0 0" fill="#ef4444" /><path d="M 0 0 C -30 10, -20 40, -5 20 C 10 40, 30 10, 0 0" fill="#dc2626" /><path d="M 0 0 C -40 -5, -30 25, 0 10 C 30 25, 40 -5, 0 0" fill="#b91c1c" /><line x1="0" y1="0" x2="-15" y2="-20" stroke="#facc15" stroke-width="3" stroke-linecap="round" /><circle cx="-15" cy="-20" r="3" fill="#facc15" /></g>`;
    const AgongSilhouetteSVG = `<g transform="translate(100, 25) scale(0.65)" opacity="0.4" fill="#000"><path d="M 15 0 C 25 -5, 35 10, 30 20 C 40 30, 35 45, 25 50 C 20 60, 5 60, 0 50 C -10 50, -15 35, -5 20 C -10 10, 0 -5, 15 0 Z" /><path d="M -5 10 C 5 -10, 25 -10, 35 10 C 30 5, 5 5, -5 10 Z" /></g>`;

    const NoteSVG = (value, width = 160, height = 80) => {
      const config = {
        '1': { bg1: '#3b82f6', bg2: '#1e40af', border: '#1e3a8a', pattern: '#93c5fd', text: '#ffffff' },      
        '5': { bg1: '#22c55e', bg2: '#166534', border: '#14532d', pattern: '#86efac', text: '#ffffff' },      
        '10': { bg1: '#ef4444', bg2: '#991b1b', border: '#7f1d1d', pattern: '#fca5a5', text: '#ffffff' },     
        '20': { bg1: '#f97316', bg2: '#9a3412', border: '#7c2d12', pattern: '#fdba74', text: '#ffffff' },     
        '50': { bg1: '#0d9488', bg2: '#115e59', border: '#134e4a', pattern: '#5eead4', text: '#ffffff' },     
        '100': { bg1: '#9333ea', bg2: '#581c87', border: '#4c1d95', pattern: '#d8b4fe', text: '#ffffff' },    
      };
      const valStr = Number(value).toString();
      const c = config[valStr];
      if (!c) return '';
      const gradId = `noteGrad${Math.random().toString(36).substring(7)}`;

      return `
        <svg width="${width}" height="${height}" viewBox="0 0 160 80" class="drop-shadow-2xl transition-transform hover:scale-110 cursor-pointer">
          <defs>
             <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${c.bg1}" />
                <stop offset="100%" stop-color="${c.bg2}" />
             </linearGradient>
             <linearGradient id="${gradId}_shine" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="white" stop-opacity="0.4" />
                <stop offset="100%" stop-color="white" stop-opacity="0" />
             </linearGradient>
          </defs>
          <rect width="160" height="80" rx="6" fill="url(#${gradId})" />
          <rect width="160" height="40" rx="6" fill="url(#${gradId}_shine)" pointer-events="none" />
          <rect x="4" y="4" width="152" height="72" rx="3" fill="none" stroke="${c.border}" stroke-width="1.5" opacity="0.8" />
          <rect x="110" y="0" width="6" height="80" fill="${c.pattern}" opacity="0.6" />
          <circle cx="30" cy="40" r="22" fill="${c.pattern}" opacity="0.3" />
          <path d="M 0 20 Q 40 40 80 20 T 160 20" fill="none" stroke="${c.pattern}" stroke-width="2" opacity="0.4" />
          <path d="M 0 60 Q 40 80 80 60 T 160 60" fill="none" stroke="${c.pattern}" stroke-width="2" opacity="0.4" />
          ${AgongSilhouetteSVG}
          ${HibiscusSVG}
          <text x="80" y="14" font-size="8" font-weight="bold" fill="${c.text}" text-anchor="middle" opacity="0.9" letter-spacing="0.5">BANK NEGARA MALAYSIA</text>
          <text x="145" y="70" font-size="10" font-weight="bold" fill="${c.text}" text-anchor="end" opacity="0.9">RINGGIT MALAYSIA</text>
          <text x="80" y="55" font-size="28" font-weight="900" fill="${c.text}" text-anchor="middle" style="text-shadow: 2px 2px 4px ${c.border}">${value}</text>
          <text x="10" y="25" font-size="10" font-weight="bold" fill="${c.text}" style="text-shadow: 1px 1px 2px ${c.border}">RM</text>
          <text x="140" y="25" font-size="12" font-weight="bold" fill="${c.text}" text-anchor="end" style="text-shadow: 1px 1px 2px ${c.border}">RM${value}</text>
        </svg>`;
    };

    const CoinSVG = (value, size = 55) => {
      const config = {
        '0.05': { r: 18, grad: 'grad5', colors: ['#f8fafc', '#94a3b8'], stroke: '#64748b', text: '5', label: 'SEN' },       
        '0.1': { r: 21, grad: 'grad10', colors: ['#f1f5f9', '#64748b'], stroke: '#475569', text: '10', label: 'SEN' },      
        '0.2': { r: 25, grad: 'grad20', colors: ['#fef08a', '#d97706'], stroke: '#92400e', text: '20', label: 'SEN' },      
        '0.5': { r: 29, grad: 'grad50', colors: ['#fde047', '#b45309'], stroke: '#78350f', text: '50', label: 'SEN' },      
      };
      const valStr = Number(value).toString();
      const c = config[valStr];
      if (!c) return '';
      const center = 30;
      const gradId = c.grad + Math.random().toString(36).substring(7);

      return `
        <svg width="${size}" height="${size}" viewBox="0 0 60 60" class="drop-shadow-xl transition-transform hover:scale-110 cursor-pointer">
          <defs>
             <radialGradient id="${gradId}" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="${c.colors[0]}" />
                <stop offset="100%" stop-color="${c.colors[1]}" />
             </radialGradient>
          </defs>
          <circle cx="${center}" cy="${center}" r="${c.r}" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="1" />
          <circle cx="${center}" cy="${center}" r="${c.r - 2}" fill="none" stroke="white" stroke-width="1" opacity="0.6" />
          ${value === 0.50 ? `<circle cx="${center}" cy="${center}" r="${c.r - 4}" fill="none" stroke="${c.stroke}" stroke-width="1" stroke-dasharray="2 2" opacity="0.7" />` : ''}
          <text x="${center}" y="${center + 4}" font-size="${value === 0.05 ? "16" : "20"}" font-weight="900" fill="${c.stroke}" text-anchor="middle" style="text-shadow: 1px 1px 1px white">${c.text}</text>
          <text x="${center}" y="${center + 12}" font-size="7" font-weight="bold" fill="${c.stroke}" text-anchor="middle">${c.label}</text>
        </svg>`;
    };

    const BasketSVG = (size = 100) => `

    // 5. GLOBAL STATE & LOGIC
    // ==========================================
    const state = {
      gameState: 'menu', 
      currentLevel: null,
      missions: [],
      currentMissionIndex: 0,
      unlockedStickers: [],
      levelProgress: { '1A': 0, '1B': 0, '2A': 0, '2B': 0, '3A': 0, '3B': 0 },
      newStickerWon: null,
      parentMath: { q: '', a: 0 },
      parentInput: '',
      playerName: '',
      showParentError: false,
      showResetConfirm: false,
      showResetSuccess: false,
      shelfItems: [],
      basket: [],
      wallet: [],
      tray: [],
      wobbleTray: false,
      tinaMsg: '',
      feedback: null, 
      audioOn: false,
      poppingBubble: null,
      mistakesCount: 0,
      levelStars: { '1A': 0, '1B': 0, '2A': 0, '2B': 0, '3A': 0, '3B': 0 },
      lastEarnedStars: 0,
      showVictory: false,
      activeAlbum: null,
      activeHint: null
    };

    window.getMissionData = () => state.missions[state.currentMissionIndex];

    window.setGameState = (s) => { state.gameState = s; renderApp(); manageAudioLoops(); };
    window.setPlayerName = (val) => { 
      state.playerName = val.toUpperCase(); 
      const displayEl = document.getElementById('display-name');
      if (displayEl) {
         displayEl.innerText = state.playerName || 'BIJAK';
      }
    };
    window.setParentInput = (val) => { state.parentInput = val; };

    window.startLevel = (levelType) => {
      enableAudio();
      playMusic(); 
      state.mistakesCount = 0;
      state.showVictory = false;
      let newMissions = [];
      
      const wholeItems = CATALOG.filter(item => Number.isInteger(item.price) && !['Beras', 'Telur'].includes(item.name));
      const snacksItems = CATALOG.filter(item => ['Biskut', 'Coklat', 'Air Kotak', 'Ais Krim', 'Air Mineral', 'Susu', 'Oren', 'Epal', 'Pisang', 'Roti', 'Keropok'].includes(item.name));
      
      if (levelType === '1A') {
        const uniqueVals = getRandomItems(PRESCHOOL_MONEY_VALUES, 5);
        for (let i = 0; i < 5; i++) {
          const val = uniqueVals[i];
          const type = val >= 1 ? 'note' : 'coin';
          const name = type === 'note' ? `Wang Kertas RM${val}` : `Syiling ${val * 100} Sen`;
          newMissions.push({ level: '1A', question: `Sila berikan ${name}`, answerVal: val, answerType: type });
        }
      } 
      else if (levelType === '1B') {
        const validPrices = [10, 5, 1, 0.50, 0.20, 0.10];
        const exactItems = CATALOG.filter(item => validPrices.includes(item.price));
        const targets = getRandomItems(exactItems, 5);
        for (let i = 0; i < 5; i++) {
          const target = targets[i];
          newMissions.push({ level: '1B', item: target, question: `Harga ${target.name} ialah ${formatMoney(target.price)}. Klik nilainya!`, answerVal: target.price });
        }
      }
      else if (levelType === '2A') {
        const itemGula = CATALOG.find(i => i.id === 'Gula-gula');
        const itemLollipop = CATALOG.find(i => i.id === 'Lollipop');
        const itemCoklatKecil = CATALOG.find(i => i.id === 'Coklat Kecil');
        for (let i = 0; i < 5; i++) {
          let items;
          if (i === 0) items = [itemGula, itemLollipop];
          else if (i === 1) items = [itemGula, itemCoklatKecil];
          else items = getRandomItems(snacksItems, 2);
          newMissions.push({ level: '2A', itemsToBuy: items, totalPrice: items.reduce((sum, item) => sum + item.price, 0) });
        }
      }
      else if (levelType === '2B') {
        const uniqueItems = getRandomItems(snacksItems.filter(i => i.price <= 9), 5);
        for (let i = 0; i < 5; i++) {
          const item = uniqueItems[i];
          let pay = item.price < 5 ? 5 : 10;
          if (item.price === 5) pay = 10;
          let change = pay - item.price;
          newMissions.push({ level: '2B', cost: item.price, pay: pay, change: change, question: `Beli RM${item.price}, bayar RM${pay}. Pilih baki RM${change} di rak!` });
        }
      }
      else if (levelType === '3A') {
        for (let i = 0; i < 5; i++) {
          let items, total;
          do {
            items = getRandomItems(wholeItems, 3);
            total = items.reduce((sum, item) => sum + item.price, 0);
          } while (total > 10);
          newMissions.push({ level: '3A', itemsToBuy: items, totalPrice: total });
        }
      }
      else if (levelType === '3B') {
        const budgets = [5, 6, 7, 8, 9, 10];
        const uniqueBudgets = getRandomItems(budgets, 5);
        for (let i = 0; i < 5; i++) {
          const b = uniqueBudgets[i];
          newMissions.push({ level: '3B', budget: b, question: `Beli 2 atau lebih barang dengan jumlah TEPAT RM${b}!` });
        }
      }

      state.missions = newMissions;
      state.currentLevel = levelType;
      state.currentMissionIndex = 0;
      state.newStickerWon = null;
      setupShopPhase(newMissions[0]);
    };

    const setupShopPhase = (mission) => {
      state.basket = [];
      state.tray = [];
      
      if (mission.level === '1A' || mission.level === '1B') {
        let availableItems = [
          { id: 'n10', val: 10, type: 'note' }, { id: 'n5', val: 5, type: 'note' }, { id: 'n1', val: 1, type: 'note' },
          { id: 'c50', val: 0.5, type: 'coin' }, { id: 'c20', val: 0.2, type: 'coin' }, { id: 'c10', val: 0.1, type: 'coin' }
        ];

        let selectedShelf = getRandomItems(availableItems, 5); 
        let hasAnswer = selectedShelf.some(item => item.val === mission.answerVal);
        if (!hasAnswer) {
           const answerItem = availableItems.find(item => item.val === mission.answerVal);
           if (answerItem) selectedShelf[0] = answerItem;
        }

        selectedShelf = selectedShelf.sort(() => Math.random() - 0.5).map((item, idx) => ({
           ...item,
           uid: Math.random().toString(36).substring(2, 9),
           bubbleId: Math.random().toString(),
           left: 5 + (idx * 18) + (Math.random() * 5) + '%',
           delay: (Math.random() * 3) + 's',
           duration: 7 + (Math.random() * 4) + 's'
        }));

        state.shelfItems = selectedShelf;
        state.tinaMsg = mission.question;
        state.gameState = 'bubbleGame';
      } else if (mission.level === '2B') {
        let availableItems = [
          { id: 'n1', val: 1, type: 'note' }, { id: 'n5', val: 5, type: 'note' },
          { id: 'n10', val: 10, type: 'note' },
          { id: 'n1_2', val: 1, type: 'note' }, { id: 'n5_2', val: 5, type: 'note' },
          { id: 'n1_3', val: 1, type: 'note' }, { id: 'n1_4', val: 1, type: 'note' }
        ];
        let selectedShelf = getRandomItems(availableItems, 6);
        state.shelfItems = selectedShelf.sort(() => Math.random() - 0.5).map(item => ({...item, uid: Math.random().toString(36).substring(2, 9)}));
        state.tinaMsg = mission.question;
        state.gameState = 'shop';
      } else if (mission.level === '3B') {
        const wholeItems = CATALOG.filter(item => Number.isInteger(item.price) && !['Beras', 'Telur'].includes(item.name));
        state.shelfItems = getRandomItems(wholeItems, 12).map(item => ({...item, uid: Math.random().toString(36).substring(2, 9)}));
        state.tinaMsg = mission.question;
        state.gameState = 'shop';
      } else {
        let targets = [...mission.itemsToBuy];
        const allowedDistractors = (mission.level === '2A') 
           ? CATALOG.filter(i => ['Biskut', 'Coklat', 'Air Kotak', 'Ais Krim', 'Air Mineral', 'Keropok', 'Lollipop', 'Coklat Kecil', 'Gula-gula'].includes(i.id)) 
           : CATALOG.filter(item => Number.isInteger(item.price) && !['Beras', 'Telur'].includes(item.name));
           
        let distractors = getRandomItems(allowedDistractors.filter(c => !targets.map(t=>t.id).includes(c.id)), 5);
        state.shelfItems = [...targets, ...distractors].sort(() => Math.random() - 0.5).map(item => ({...item, uid: Math.random().toString(36).substring(2, 9)}));
        const itemNames = mission.itemsToBuy.map(i => i.name).join(' & ');
        state.tinaMsg = `Mari beli: ${itemNames}!`;
        state.gameState = 'shop';
      }
      renderApp(); manageAudioLoops();
    };

    window.generateWallet = (targetAmount) => {
      let required = [];
      let remaining = targetAmount;
      for (let val of ALL_MONEY_VALUES) {
        while (remaining >= val - 0.001) { 
          required.push(val);
          remaining -= val;
        }
      }
      let distractors = state.currentLevel.startsWith('3') ? [1, 5, 10] : [0.5, 0.2, 0.1, 1, 5];
      let initialWallet = [...required, ...distractors].sort((a,b) => b - a);
      state.wallet = initialWallet.map((val, idx) => ({ id: `w_${idx}`, val, type: val >= 1 ? 'note' : 'coin' }));
    };

    window.handleShelfClick = (uid) => {
      const clickedItem = state.shelfItems.find(i => i.uid === uid);
      if (!clickedItem) return;
      const mission = getMissionData();
      if (state.feedback !== null || state.poppingBubble !== null) return;

      if (mission.level === '1A') {
        if (clickedItem.val === mission.answerVal && clickedItem.type === mission.answerType) {
          state.poppingBubble = clickedItem.bubbleId; renderApp();
          setTimeout(() => { playCorrect(); successFeedback(); state.poppingBubble = null; renderApp(); }, 300);
        } else {
          playWrong(); wrongFeedback("Bukan yang itu. " + mission.question);
        }
      } else if (mission.level === '1B') {
        if (clickedItem.val === mission.answerVal) {
          state.poppingBubble = clickedItem.bubbleId; renderApp();
          setTimeout(() => { playCorrect(); successFeedback(); state.poppingBubble = null; renderApp(); }, 300);
        } else {
          playWrong(); wrongFeedback(`Cari wang yang nilainya tepat ${formatMoney(mission.answerVal)}!`);
        }
      } else if (mission.level === '2B') {
        const currentSum = state.basket.reduce((acc, b) => acc + (b.val || 0), 0);
        const newSum = currentSum + clickedItem.val;
        if (Math.abs(newSum - mission.change) < 0.01) {
          playCorrect(); successFeedback();
        } else if (newSum > mission.change) {
          playWrong(); wrongFeedback("Terlebih baki! Mula semula."); state.basket = []; renderApp();
        } else {
          playTone(600, 'sine', 0.1, 0.1);
          state.basket.push(clickedItem);
          state.tinaMsg = `Baki dikumpul: ${formatMoney(newSum)}. Perlukan ${formatMoney(mission.change)}`;
          renderApp();
        }
      } else if (mission.level === '3B') {
        playTone(600, 'sine', 0.1, 0.1);
        state.basket.push(clickedItem);
        state.tinaMsg = `Masuk bakul! Jumlah: ${formatMoney(state.basket.reduce((a,b) => a + (b.price || 0), 0))}`;
        renderApp();
      } else {
        const targetCount = mission.itemsToBuy.filter(i => i.id === clickedItem.id).length;
        const basketCount = state.basket.filter(i => i.id === clickedItem.id).length;
        if (basketCount < targetCount) {
          playCorrect();
          state.basket.push(clickedItem);
          state.tinaMsg = "Bagus! Masuk dalam bakul.";
          renderApp();
          if (state.basket.length === mission.itemsToBuy.length) {
            setTimeout(() => {
              state.tinaMsg = `Jom bayar ${formatMoney(mission.totalPrice)}!`;
              generateWallet(mission.totalPrice);
              state.gameState = 'checkout';
              renderApp(); manageAudioLoops();
            }, 1500);
          }
        } else {
          playWrong(); wrongFeedback("Kita tak perlukan ini, cari yang dalam senarai!");
        }
      }
    };

    window.moveMoneyToTray = (id) => {
      const item = state.wallet.find(m => m.id === id);
      state.wallet = state.wallet.filter(m => m.id !== id);
      state.tray.push(item);
      renderApp();
    };
    
    window.moveMoneyToWallet = (id) => {
      const item = state.tray.find(m => m.id === id);

      const mission = getMissionData();
      const uniqueItemsToBuy = (mission.level === '2A' || mission.level === '3A') ? Array.from(new Set(mission.itemsToBuy.map(i => i.id))) : [];

      const renderShelfRow = (speed, isTop = false) => {
          const multipliedItems = [...state.shelfItems, ...state.shelfItems, ...state.shelfItems, ...state.shelfItems].sort(() => Math.random() - 0.5);
          return `
             <div class="w-full overflow-hidden relative ${isTop ? 'h-28' : 'h-36'} flex items-end mb-4">

                   ${multipliedItems.map((item, idx) => {
                      const isTaken = (mission.level === '2A' || mission.level === '3A') && (state.basket.filter(b => b.id === item.id).length >= (mission.itemsToBuy.filter(i => i.id === item.id).length || 0) && mission.itemsToBuy.filter(i => i.id === item.id).length > 0);
                      return `
                       <div class="relative flex flex-col items-center justify-end ${isTop ? 'h-24 min-w-[120px]' : 'h-32 min-w-[140px]'} mx-2">

                            <div class="cursor-pointer mb-2 animate-premium-float hover:scale-110 transition-transform" onclick="handleShelfClick('${item.uid}')">

                          ${(item.price && !isTaken) ? `
                            <div class="absolute -bottom-4 bg-white border-2 border-slate-300 font-bold px-2 py-0.5 rounded shadow-sm text-xs z-20">

      return `

                 <div class="font-bold text-slate-700 text-sm text-center">${mission.question}</div>

             ${mission.level === '1B' ? `
                 <div class="flex flex-col items-center gap-1">

             ${(mission.level === '2A' || mission.level === '3A') ? `
                 <div class="flex justify-center gap-4 w-full mt-1">
                    ${uniqueItemsToBuy.map(id => {
                        const target = mission.itemsToBuy.filter(i => i.id === id).length;

                            <div class="flex flex-col items-center transition-all duration-300 ${isDone ? 'opacity-60 scale-95' : 'scale-100'}">

                                <span class="text-[11px] mt-1 font-bold text-center ${isDone ? 'line-through text-slate-400' : 'text-slate-700'}">${target > 1 ? `${target}x ` : ''}${id}</span>

          ${mission.level === '3B' ? `
             <div class="absolute bottom-[90px] right-4 z-40 flex flex-col items-end">
               <div class="bg-sky-100 text-sky-800 text-[10px] font-bold px-2 py-1 rounded shadow-sm border border-sky-300 mb-1 animate-pulse text-center max-w-[120px] leading-tight">
                 Sila tekan SELESAI bila jawapan betul
               </div>
               ${Button3D(`<span>SELESAI</span><span class="text-[10px] font-normal">Misi: ${formatMoney(mission.budget)}</span>`, 
               `
                  const sum = state.basket.reduce((acc, b) => acc + (b.price || 0), 0);
                  if (state.basket.length < 2) {
                     playWrong(); wrongFeedback('Sila pilih 2 atau lebih barang!');
                  } else if (Math.abs(sum - ${mission.budget}) < 0.01) {
                     playCorrect();
                     successFeedback('Hebat! Jumlah pembelian tepat RM ' + sum.toFixed(2));
                  } else if (sum < ${mission.budget}) {
                     playWrong(); wrongFeedback('Jumlah belum cukup! Sekarang RM ' + sum.toFixed(2)); state.basket = []; renderApp();
                  } else {
                     playWrong(); wrongFeedback('Terlebih bajet! Jumlah RM ' + sum.toFixed(2)); state.basket = []; renderApp();
                  }
               `, "blue", "px-4 py-2 text-sm flex flex-col items-center shadow-lg animate-bounce-slight")}
             </div>
          ` : ''}

          ${(mission.level === '2A' || mission.level === '3A' || mission.level === '3B' || mission.level === '2B') ? `
             <div class="absolute bottom-1 right-4 z-30 flex flex-col items-center">
                <div class="relative pointer-events-none">
                   ${BasketSVG(85)}

                         <div class="-ml-5 drop-shadow-md z-10">

        </div>`;
    };

    const renderBubbleGame = () => {
      const mission = getMissionData();
      return `
        <div class="flex flex-col h-full w-full relative overflow-hidden bg-gradient-to-b from-cyan-100 via-sky-300 to-blue-500">

          <div class="bg-white/40 backdrop-blur-md p-4 flex justify-between items-center z-20 rounded-b-3xl border-b border-white/50 shadow-sm">
             <button onclick="setGameState('levels')" class="text-white font-bold bg-sky-600/90 px-4 py-1.5 rounded-full border-b-4 border-sky-800 active:border-0 active:translate-y-1 text-sm">Tutup</button>
             <div class="bg-white/90 px-4 py-1.5 rounded-full font-bold text-sky-700 shadow-sm border border-sky-100 text-sm">Soalan ${state.currentMissionIndex + 1} / 5</div>
          </div>

          <div class="absolute top-20 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm bg-white/95 backdrop-blur-md rounded-3xl shadow-[0_8px_20px_rgba(0,0,0,0.15)] border-4 border-white/80 p-4 z-30 pointer-events-none flex flex-col items-center">
             <h3 class="font-black text-sky-500 text-sm mb-1 uppercase tracking-wider drop-shadow-sm">Pecahkan Buih Yang Betul!</h3>
             ${mission.level === '1A' ? `
                 <div class="font-bold text-slate-700 text-center leading-snug">${mission.question}</div>
             ` : ''}
             ${mission.level === '1B' ? `
                 <div class="flex flex-col items-center gap-1">
                   <span class="font-bold text-slate-700 text-xs text-center">${mission.question}</span>
                   <div class="bg-sky-50 px-3 py-1 rounded-2xl shadow-inner border border-sky-200 flex items-center gap-2 mt-1">
                      ${ItemSVG(mission.item.id, 35)}
                      <span class="font-black text-sky-700">${formatMoney(mission.item.price)}</span>
                   </div>
                 </div>
             ` : ''}
          </div>

          <div class="flex-1 w-full relative z-10 overflow-hidden pointer-events-none mt-10">
             ${state.shelfItems.map((item, idx) => {
                const isPopping = state.poppingBubble === item.bubbleId;
                return `
                <div 
                   class="absolute bottom-[-150px] pointer-events-auto cursor-pointer flex justify-center ${isPopping ? 'animate-bubble-pop z-50' : 'animate-float-up'}"
                   style="left: ${item.left}; animation-delay: ${isPopping ? '0s' : item.delay}; animation-duration: ${isPopping ? '0.3s' : item.duration}"
                   onclick="playTone(900, 'sine', 0.05, 0.1); handleShelfClick('${item.uid}');"
                >
                   <div class="relative w-24 h-24 sm:w-28 sm:h-28 bg-gradient-to-br from-white/30 via-pink-100/10 to-cyan-100/20 backdrop-blur-[2px] rounded-full border-[1px] border-white/60 shadow-[inset_0_0_20px_rgba(255,255,255,0.8),_0_4px_12px_rgba(0,0,0,0.1)] flex items-center justify-center transition-transform hover:scale-110 active:scale-95 group ${isPopping ? 'opacity-0 transition-opacity duration-75' : ''}">
                      <div class="absolute top-2 right-4 w-5 h-2 bg-white rounded-full opacity-80 transform rotate-45 blur-[1px]"></div>
                      <div class="absolute top-4 right-3 w-2 h-2 bg-white rounded-full opacity-70"></div>

                      <div class="absolute bottom-4 right-4 w-4 h-1 bg-cyan-300 rounded-full opacity-40 transform rotate-45 blur-[2px]"></div>
                      
                      <div class="scale-75 group-hover:scale-90 transition-transform drop-shadow-md pointer-events-none flex justify-center items-center">

             ${SpeechBubble(state.tinaMsg, "mb-4 pointer-events-auto max-w-[150px]", "left")}
          </div>
        </div>`;
    };

    const renderCheckout = () => {
      const mission = getMissionData();
      const currentTotal = state.tray.reduce((sum, item) => sum + item.val, 0);

      return `
        <div class="flex flex-col h-full w-full bg-slate-50 relative overflow-hidden">
          <div class="bg-gradient-to-r from-sky-500 to-sky-600 shadow-md p-4 flex justify-between items-center z-20 rounded-b-3xl gap-2">
             <button onclick="setGameState('levels')" class="text-white font-bold bg-sky-700 px-4 py-1.5 rounded-full border-b-4 border-sky-800 active:border-0 active:translate-y-1 text-sm shrink-0">Tutup</button>
             <div class="bg-white px-4 py-1.5 rounded-full font-bold text-sky-700 shadow-inner text-sm whitespace-nowrap">Soalan ${state.currentMissionIndex + 1} / 5</div>
          </div>

          <div class="flex-1 flex flex-col items-center pt-2 pb-2 relative z-10 w-full px-4">
             <div class="flex gap-4 mb-2 bg-white/60 px-6 py-3 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto max-w-full">
               ${mission.itemsToBuy.map((item, idx) => `
                  <div class="flex flex-col items-center shrink-0">
                    ${ItemSVG(item.id, 50)}
                    <span class="text-[10px] font-bold mt-1 text-slate-500">${formatMoney(item.price)}</span>
                  </div>
               `).join('')}
             </div>
             
             ${SpeechBubble(`Sila bayar ${formatMoney(mission.totalPrice)}`, "mb-2")}
             <div class="text-center px-4 mb-2 w-full">
                <p class="text-[11px] sm:text-[12px] font-bold text-sky-800 bg-sky-100 px-3 py-2 rounded-xl shadow-sm border border-sky-300 animate-pulse leading-snug">
                  💡 klik wang untuk pembetulan & bayaran wang yang betul
                </p>
             </div>
             
             <div class="w-full max-w-sm bg-gradient-to-b from-slate-200 to-slate-300 rounded-2xl p-4 shadow-inner border-4 ${state.wobbleTray ? 'border-red-400 animate-wobble' : 'border-slate-300'} min-h-[140px] flex flex-col">
               <div class="flex justify-between items-center mb-2 border-b-2 border-slate-400 pb-2">
                 <span class="font-bold text-slate-600 uppercase text-sm">Jumlah Bayaran</span>
                 <span class="font-black text-xl text-teal-600 bg-white px-3 rounded-md shadow-sm">${formatMoney(currentTotal)}</span>
               </div>
               
               <div class="flex-1 flex flex-wrap gap-2 justify-center items-center">
                  ${state.tray.length === 0 ? `<span class="text-slate-400 font-bold text-sm italic">Tekan wang di bawah untuk masukkan</span>` : ''}
                  ${state.tray.map(item => `
                    <div onclick="moveMoneyToWallet('${item.id}')">
                       ${item.type === 'note' ? NoteSVG(item.val, 90, 45) : CoinSVG(item.val, 40)}
                    </div>
                  `).join('')}
               </div>
             </div>

             <div class="w-full mt-auto pt-4 border-t-2 border-slate-200 bg-white shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] rounded-t-3xl p-4 pb-6">
                <div class="flex justify-between items-center mb-3">
                   <span class="font-bold text-slate-700 text-sm">Dompet Anda</span>
                   ${Button3D("BAYAR", "handlePayment()", "green", "py-2 px-6 text-sm")}
                </div>
                <div class="flex flex-wrap gap-3 justify-center max-h-40 overflow-y-auto pt-2 pb-2">
                   ${state.wallet.map(item => `
                     <div onclick="moveMoneyToTray('${item.id}')">
                        ${item.type === 'note' ? NoteSVG(item.val, 100, 50) : CoinSVG(item.val, 45)}
                     </div>
                   `).join('')}
                </div>
             </div>
          </div>
        </div>`;
    };

    const renderResult = () => `
      <div class="flex flex-col items-center justify-center h-full text-center px-4 space-y-4 bg-gradient-to-br from-mint-50 to-sky-100 z-10 w-full relative overflow-hidden">
        <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-teal-200 rounded-full mix-blend-multiply blur-3xl opacity-60 pointer-events-none"></div>
        
        ${state.lastEarnedStars === 3 ? `
             ${Firework(0, '20%', '15%', 0.8)}
             ${Firework(0.5, '80%', '25%', 1.2)}
             ${Firework(1.2, '50%', '10%', 0.9)}
             ${Firework(0.8, '15%', '50%', 0.6)}
             ${Firework(1.5, '85%', '60%', 1)}
        ` : ''}

        <div class="flex gap-2 sm:gap-4 z-20 mt-4">
           ${[1, 2, 3].map((s) => `
             <svg class="w-16 h-16 sm:w-20 sm:h-20 ${state.lastEarnedStars >= s ? 'text-yellow-400 animate-bounce-slight drop-shadow-[0_4px_8px_rgba(250,204,21,0.6)]' : 'text-slate-300 grayscale opacity-50'}" style="animation-delay: ${s*0.2}s" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
             </svg>
           `).join('')}
        </div>

        <h1 class="text-3xl font-black text-green-600 drop-shadow-sm z-20 uppercase leading-snug">Tahniah! 🎉<br/>Anda Telah Tamat<br/>Tahap Ini!</h1>
        
        ${state.showVictory && state.newStickerWon ? `
           <div class="bg-white px-6 py-4 rounded-3xl shadow-xl border-4 border-amber-300 z-20 animate-fade-in flex flex-col items-center">
              <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Sticker Baharu Dibuka!</span>
              <div class="mb-2 animate-bounce-slight">
                 ${ItemSVG(state.newStickerWon.icon, 80)}
              </div>
              <span class="text-sm font-black text-amber-600 mt-2">${state.newStickerWon.name}</span>
           </div>
        ` : state.showVictory && !state.newStickerWon ? `
           <div class="bg-white px-6 py-4 rounded-3xl shadow-xl border-4 border-amber-300 z-20 animate-fade-in flex flex-col items-center">
              <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Hebat!</span>
              <span class="text-sm font-black text-amber-600 mt-2 text-center leading-tight">Semua sticker telah<br/>berjaya dikumpul! 🏆</span>
           </div>
        ` : `
           <div class="flex flex-col items-center z-20 mt-2 cursor-pointer" onclick="${state.lastEarnedStars === 3 ? 'state.showVictory=true; renderApp();' : ''}">
               ${state.lastEarnedStars === 3 ? `
                  <div class="relative animate-bounce-slight hover:scale-110 transition-transform">
                     <div class="text-8xl drop-shadow-2xl">🎁</div>
                     <div class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-black px-2 py-1 rounded-full animate-pulse border-2 border-white shadow-md">BUKA!</div>
                  </div>
               ` : `
                  <div class="bg-slate-100 px-6 py-4 rounded-3xl border-2 border-slate-300 flex flex-col items-center shadow-inner">
                     <div class="text-5xl drop-shadow-md mb-2">🪙</div>
                     <span class="text-xs font-bold text-slate-500 px-4">Dapatkan 3 Bintang ⭐⭐⭐ penuh untuk membuka kotak hadiah misteri!</span>
                  </div>
               `}
           </div>
        `}

        <div class="mt-4 z-20 w-full max-w-[280px]">
          ${Button3D("Menu Tahap", "enableAudio(); setGameState('levels'); state.showVictory = false;", "blue", "w-full text-lg py-3")}
        </div>
      </div>`;

    // ==========================================
    // 7. CORE RENDER CYCLE
    // ==========================================
    const renderApp = () => {
      const container = document.getElementById('app');
      let html = '';

      if (state.gameState === 'menu') html = renderMenu();
      else if (state.gameState === 'levels') html = renderLevels();
      else if (state.gameState === 'shop') html = renderShop();
      else if (state.gameState === 'bubbleGame') html = renderBubbleGame();
      else if (state.gameState === 'checkout') html = renderCheckout();
      else if (state.gameState === 'result') html = renderResult();
      else if (state.gameState === 'stickers') html = renderStickers();
      else if (state.gameState === 'parentGate') html = renderParentGate();
      else if (state.gameState === 'parents') html = renderParentsDashboard();

      if (state.feedback) {
        html += `
          <div class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-white/95 backdrop-blur-sm animate-fade-in ${state.feedback === 'correct' ? 'text-green-500' : 'text-red-500'}">
             ${state.feedback === 'correct' ? `
               <div class="flex flex-col items-center">
                 <svg class="w-40 h-40 text-yellow-400 animate-bounce drop-shadow-xl" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" /></svg>
                 <h2 class="text-5xl font-black mt-6 drop-shadow-sm text-green-500 tracking-wider">BETUL! 🎉</h2>
                 ${Button3D("Seterusnya &rarr;", "nextMission()", "green", "mt-8 px-8 py-3 text-2xl font-bold")}
               </div>
             ` : `
               <div class="flex flex-col items-center">
                 ${Shopkeeper(150, "mb-4 drop-shadow-xl")}
                 <h2 class="text-2xl font-black mt-2 drop-shadow-sm text-amber-600 tracking-wide bg-white px-6 py-3 rounded-full border-4 border-amber-300 text-center whitespace-pre-line leading-tight">
                    ${state.tinaMsg}
                 </h2>
               </div>
             `}
          </div>`;
      }

      container.innerHTML = html;
    };

    // Initialize application
    window.onload = () => {
      renderApp();
    };
  </script>
</body>
</html>
